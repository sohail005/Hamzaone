<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>HamzaOne Shop Mobile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Manrope:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#111318;text-decoration:none}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid #F97316;outline-offset:2px}
</style>
</helmet>
<div style="width:390px;min-height:1700px;background:#F6F5F1;color:#111318;font-family:Inter,sans-serif;font-size:15px;line-height:1.5;position:relative;overflow:hidden">
<header style="position:sticky;top:0;z-index:20;background:#F6F5F1;border-bottom:1px solid #E8E8E5;padding:6px 8px;display:flex;flex-direction:column;gap:8px">
<div style="display:flex;align-items:center;gap:4px"><a href="MobileHome.dc.html" aria-label="Back to home" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;font-size:20px">←</a><a href="MobileHome.dc.html" style="flex:1;font:800 21px Manrope,sans-serif">Hamza<span style="color:#F97316">One</span></a><a href="Cart.dc.html" aria-label="Cart, 2 items" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;gap:2px;font-weight:700;font-size:13px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M5 8h14l-1 12H6L5 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>2</a></div>
<div style="margin:0 8px 6px;display:flex;align-items:center;gap:8px;background:#fff;border:1px solid #8E9097;border-radius:999px;height:44px;padding:0 14px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#686B72" stroke-width="1.8" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><label for="mq" style="position:absolute;left:-9999px">Search</label><input id="mq" value="{{q}}" onChange="{{onQ}}" placeholder="Search products" style="border:0;outline:0;flex:1;font:16px Inter,sans-serif;background:transparent;min-width:0"></div>
</header>
<main style="padding:16px;display:flex;flex-direction:column;gap:14px">
<div><h1 style="margin:0;font:700 28px Manrope,sans-serif">{{heading}}</h1><p style="margin:0;color:#686B72;font-size:14px" role="status">{{count}} products</p></div>
<div style="display:flex;gap:8px">
<button onClick="{{openFilters}}" style="flex:1;min-height:44px;border-radius:999px;border:1px solid #111318;background:#fff;font:600 14px Inter,sans-serif;cursor:pointer">Filters{{activeText}}</button>
<button onClick="{{openSort}}" style="flex:1;min-height:44px;border-radius:999px;border:1px solid #CFCDC6;background:#fff;font:600 14px Inter,sans-serif;cursor:pointer">Sort: {{sortLabel}}</button>
</div>
<sc-if value="{{empty}}" hint-placeholder-val="{{ false }}"><div style="background:#fff;border:1px solid #E8E8E5;border-radius:16px;padding:32px 20px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center"><strong style="font:700 18px Manrope,sans-serif">No products match</strong><span style="color:#686B72;font-size:14px">Try fewer filters or request a custom print.</span><button onClick="{{reset}}" style="min-height:48px;padding:0 20px;border-radius:999px;border:0;background:#111318;color:#fff;font:600 15px Inter,sans-serif;cursor:pointer">Reset filters</button><a href="CustomPrint.dc.html" style="color:#C2410C;font-weight:600;min-height:32px">Request a custom print</a></div></sc-if>
<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px">
<sc-for list="{{items}}" as="p" hint-placeholder-count="8"><a href="MobileProduct.dc.html" style="display:flex;flex-direction:column;gap:6px"><div style="aspect-ratio:1/1;background:#ECEAE4;border-radius:14px;display:flex;align-items:center;justify-content:center;position:relative"><div style="{{p.shape}}"></div><span style="position:absolute;left:8px;top:8px;font-size:11px;font-weight:600;border-radius:999px;padding:2px 8px;{{p.bs}}">{{p.b}}</span></div><strong style="font-size:14px;line-height:1.3">{{p.n}}</strong><span style="font-weight:700">₹{{p.price}}</span></a></sc-for>
</div>
</main>

<sc-if value="{{sheet}}" hint-placeholder-val="{{ false }}">
<div style="position:absolute;inset:0;z-index:50">
<button aria-label="Close" onClick="{{closeSheet}}" style="position:absolute;inset:0;width:100%;background:rgba(17,19,24,.45);border:0"></button>
<div role="dialog" aria-modal="true" aria-label="{{sheetTitle}}" style="position:absolute;left:0;right:0;top:300px;background:#fff;border-radius:24px 24px 0 0;padding:8px 16px 20px;box-sizing:border-box;display:flex;flex-direction:column;gap:16px;box-shadow:0 -8px 24px rgba(17,19,24,.12)">
<span aria-hidden="true" style="width:40px;height:4px;border-radius:2px;background:#CFCDC6;align-self:center;margin-top:4px"></span>
<div style="display:flex;justify-content:space-between;align-items:center"><strong style="font:700 20px Manrope,sans-serif">{{sheetTitle}}</strong><button onClick="{{closeSheet}}" aria-label="Close" style="width:44px;height:44px;border:0;background:none;font-size:18px;cursor:pointer">✕</button></div>
<sc-if value="{{isFilter}}" hint-placeholder-val="{{ true }}">
<fieldset style="border:0;margin:0;padding:0"><legend style="font-weight:600;margin-bottom:8px">Category</legend><div style="display:flex;flex-wrap:wrap;gap:8px"><sc-for list="{{catOpts}}" as="c" hint-placeholder-count="5"><button onClick="{{c.toggle}}" aria-pressed="{{c.on}}" style="min-height:44px;padding:0 14px;border-radius:999px;font:600 14px Inter,sans-serif;cursor:pointer;{{c.style}}">{{c.label}}</button></sc-for></div></fieldset>
<fieldset style="border:0;margin:0;padding:0"><legend style="font-weight:600;margin-bottom:8px">Availability</legend><div style="display:flex;flex-wrap:wrap;gap:8px"><sc-for list="{{availOpts}}" as="c" hint-placeholder-count="2"><button onClick="{{c.toggle}}" aria-pressed="{{c.on}}" style="min-height:44px;padding:0 14px;border-radius:999px;font:600 14px Inter,sans-serif;cursor:pointer;{{c.style}}">{{c.label}}</button></sc-for></div></fieldset>
<fieldset style="border:0;margin:0;padding:0"><legend style="font-weight:600;margin-bottom:8px">Price</legend><div style="display:flex;flex-wrap:wrap;gap:8px"><sc-for list="{{priceOpts}}" as="c" hint-placeholder-count="3"><button onClick="{{c.pick}}" aria-pressed="{{c.on}}" style="min-height:44px;padding:0 14px;border-radius:999px;font:600 14px Inter,sans-serif;cursor:pointer;{{c.style}}">{{c.label}}</button></sc-for></div></fieldset>
<div style="display:flex;gap:8px;position:sticky;bottom:0"><button onClick="{{reset}}" style="flex:1;min-height:52px;border-radius:999px;border:1px solid #111318;background:#fff;font:600 15px Inter,sans-serif;cursor:pointer">Reset</button><button onClick="{{closeSheet}}" style="flex:2;min-height:52px;border-radius:999px;border:0;background:#F97316;color:#111318;font:600 15px Inter,sans-serif;cursor:pointer">Show {{count}} products</button></div>
</sc-if>
<sc-if value="{{isSort}}" hint-placeholder-val="{{ false }}">
<div role="radiogroup" style="display:flex;flex-direction:column"><sc-for list="{{sorts}}" as="o" hint-placeholder-count="4"><button role="radio" aria-checked="{{o.on}}" onClick="{{o.pick}}" style="min-height:52px;display:flex;justify-content:space-between;align-items:center;border:0;border-bottom:1px solid #E8E8E5;background:none;font:500 16px Inter,sans-serif;cursor:pointer;color:#111318;text-align:left">{{o.label}}<span>{{o.mark}}</span></button></sc-for></div>
</sc-if>
</div></div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1700}}'>
const SH = {vase:c=>`width:40px;height:80px;border-radius:20px 20px 12px 12px;background:${c}`,stand:c=>`width:60px;height:64px;background:${c};clip-path:polygon(30% 0,46% 0,72% 78%,100% 78%,100% 100%,0 100%,0 78%,52% 78%)`,plate:c=>`width:96px;height:36px;border-radius:8px;background:${c}`,fig:c=>`width:70px;height:62px;background:${c};border-radius:60% 40% 55% 45%`,part:c=>`width:60px;height:60px;background:${c};clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)`,planter:c=>`width:76px;height:60px;background:${c};clip-path:polygon(0 0,100% 0,84% 100%,16% 100%)`,key:c=>`width:48px;height:48px;border-radius:50%;border:11px solid ${c};box-sizing:border-box`,org:c=>`width:84px;height:50px;border-radius:10px;background:${c}`};
const P = [['Spiral Decor Vase','decor',699,'vase','#C96F4A','stock'],['Geometric Planter','decor',449,'planter','#5E7A6A','stock'],['Wave Coaster Set','decor',349,'plate','#3C5A80','stock'],['Lattice Lamp Shade','decor',1299,'vase','#D9C6A5','mto'],['Minimal Phone Stand','desk',249,'stand','#2B2E33','stock'],['Headphone Stand','desk',799,'stand','#8C8F96','stock'],['Cable Organizer','desk',149,'org','#3C5A80','stock'],['Custom Name Plate','personal',399,'plate','#D9C6A5','mto'],['Personalized Keychain','personal',149,'key','#F97316','mto'],['Articulated Dragon','figurine',499,'fig','#5E7A6A','mto'],['Mini Ganesha','figurine',599,'fig','#C9A24A','stock'],['Gear Fidget','functional',249,'part','#3C5A80','stock']];
const CATS = [['decor','Home Decor'],['desk','Desk'],['personal','Personalised'],['figurine','Figurines'],['functional','Functional']];
const B = {stock:['In stock','background:#E3F3EC;color:#0F5E41'],mto:['Made to order','background:#FDEBD8;color:#8A4A0A']};
class Component extends DCLogic {
  constructor(p){ super(p); this.state = { sheet:'', cats:['decor'], avail:[], price:'all', sort:'featured', q:'' }; }
  renderVals() {
    const s = this.state, chip = on => on?'background:#111318;color:#fff;border:1px solid #111318':'background:#fff;color:#111318;border:1px solid #8E9097';
    let list = P.filter(p=>(!s.cats.length||s.cats.includes(p[1]))&&(!s.avail.length||s.avail.includes(p[5]))&&(s.price==='all'||(s.price==='u300'?p[2]<300:s.price==='mid'?p[2]>=300&&p[2]<=700:p[2]>700))&&(!s.q||p[0].toLowerCase().includes(s.q.toLowerCase())));
    if(s.sort==='low') list=[...list].sort((a,b)=>a[2]-b[2]); if(s.sort==='high') list=[...list].sort((a,b)=>b[2]-a[2]);
    const tog = (k,v)=>this.setState({[k]:s[k].includes(v)?s[k].filter(x=>x!==v):[...s[k],v]});
    const n = s.cats.length+s.avail.length+(s.price!=='all'?1:0);
    const SORTS = [['featured','Featured'],['low','Price: low to high'],['high','Price: high to low']];
    return {
      q:s.q, onQ:e=>this.setState({q:e.target.value}),
      heading: s.q?`“${s.q}”`:(s.cats.length===1?CATS.find(c=>c[0]===s.cats[0])[1]:'All products'),
      count:list.length, empty:list.length===0, activeText: n?` (${n})`:'',
      items: list.map(p=>({n:p[0],price:p[2].toLocaleString('en-IN'),shape:SH[p[3]](p[4]),b:B[p[5]][0],bs:B[p[5]][1]})),
      sheet:!!s.sheet, isFilter:s.sheet==='filter', isSort:s.sheet==='sort', sheetTitle:s.sheet==='sort'?'Sort by':'Filters',
      openFilters:()=>this.setState({sheet:'filter'}), openSort:()=>this.setState({sheet:'sort'}), closeSheet:()=>this.setState({sheet:''}),
      catOpts: CATS.map(([v,l])=>({label:l,on:s.cats.includes(v),style:chip(s.cats.includes(v)),toggle:()=>tog('cats',v)})),
      availOpts: [['stock','In stock'],['mto','Made to order']].map(([v,l])=>({label:l,on:s.avail.includes(v),style:chip(s.avail.includes(v)),toggle:()=>tog('avail',v)})),
      priceOpts: [['u300','Under ₹300'],['mid','₹300–700'],['o700','Above ₹700']].map(([v,l])=>({label:l,on:s.price===v,style:chip(s.price===v),pick:()=>this.setState({price:s.price===v?'all':v})})),
      reset:()=>this.setState({cats:[],avail:[],price:'all',q:''}),
      sortLabel: SORTS.find(x=>x[0]===s.sort)[1].replace('Price: ',''),
      sorts: SORTS.map(([v,l])=>({label:l,on:s.sort===v,mark:s.sort===v?'✓':'',pick:()=>this.setState({sort:v,sheet:''})}))
    };
  }
}
</script>
</body>
</html>
